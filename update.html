<!DOCTYPE html>
<html lang="az">
<head>

      margin-bottom: 15px;
    }

    h1 {
      font-size: 25px;
    }

    p {
      color: #b9a9c9;
      font-size: 13px;
      line-height: 1.6;
    }

    .download {
      display: block;
      margin-top: 25px;
      padding: 16px;
      border-radius: 13px;
      background: linear-gradient(100deg, #7900ff, #c000ff);
      color: white;
      text-decoration: none;
      font-weight: bold;

</head>

<body>
  <div class="card">
    <div class="logo">💎</div>
